[package]
name = "thus-saith"
version = "0.7.2"
edition = "2024"
authors = ["Lingxuan Ye <ink@lingxuan.io>"]
categories = ["command-line-utilities"]
repository = "https://github.com/Lingxuan-Ye/thus-saith"
readme = "README.md"
license = "MIT"
description = "Thus saith my waifu!"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["cargo"] }
ctrlc = "3.5.2"
dirs = "6.0.0"
eoe = "0.4.1"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
rand = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

[profile.release]
strip = true
lto = true
panic = "abort"
